<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- CyberGlyph zero-trust padlock. Each group is a separate layer to animate in Rive. -->
  <g id="glow">
    <circle cx="120" cy="138" r="92" fill="#4F86FF" fill-opacity="0.14"/>
  </g>
  <g id="shackle">
    <path d="M84 112 V82 a36 36 0 0 1 72 0 V112" fill="none" stroke="#C9D2E3" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g id="body">
    <rect x="56" y="104" width="128" height="100" rx="22" fill="#1A2030"/>
    <rect x="56.75" y="104.75" width="126.5" height="98.5" rx="21.25" fill="none" stroke="#2F3A55" stroke-width="1.5"/>
  </g>
  <g id="keyhole">
    <circle cx="120" cy="143" r="13" fill="#4F86FF"/>
    <path d="M113.5 150 h13 l4 26 h-21 z" fill="#4F86FF"/>
  </g>
  <g id="status-ring">
    <circle cx="120" cy="154" r="36" fill="none" stroke="#4F86FF" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
